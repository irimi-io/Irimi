[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
irimi = { workspace = true }
irimi-store = { workspace = true }
irimi-cli = { workspace = true }

[dependency-groups]
dev = [
    "irimi",
    "irimi-store",
    "irimi-cli",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ERA", "PT", "RET", "PTH"]

[tool.mypy]
strict = true
files = ["packages"]
mypy_path = ["packages/sdk/src", "packages/store/src", "packages/cli/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib", "--strict-markers"]
