[project]
name = "irimi-store"
version = "0.0.0"
description = "The irimi run store."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "irimi",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
irimi = { workspace = true }
