[project]
name = "irimi-cli"
version = "0.0.0"
description = "The irimi command line."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["irimi-store"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
irimi = "irimi_cli.main:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
irimi-store = { workspace = true }
